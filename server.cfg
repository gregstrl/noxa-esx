# =====================================================================
#  NOXA — Base FiveM RP sur ESX Legacy
# =====================================================================

endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"
sv_endpointPrivacy true

sv_hostname "Noxa | Serveur RP"
sets sv_projectName "Noxa RP"
sets sv_projectDesc "Serveur RP Noxa — base ESX Legacy"
sets tags "roleplay, esx, fr, noxa"

set steam_webApiKey ""
sv_licenseKey "VOTRE_LICENCE_ICI"            # <-- ICI ta clé keymaster
sv_maxclients 48

sv_enforceGameBuild 3095
set onesync on
set resources_useSystemChat true

# MySQL — adapte user/password/base
set mysql_connection_string "mysql://root:@localhost/noxa?waitForConnections=true&charset=utf8mb4"
set mysql_ui true

setr esx:locale "fr"

# Base FiveM
ensure chat
ensure spawnmanager
ensure hardcap

# Permissions admin
add_principal group.admin group.user
add_ace group.admin command allow
add_ace group.admin command.quit deny
add_ace resource.es_extended command.add_ace allow
add_ace resource.es_extended command.add_principal allow
add_ace resource.es_extended command.remove_principal allow
add_ace resource.es_extended command.stop allow

# =====================================================================
#  Dépendances
# =====================================================================
ensure oxmysql
ensure menuv

# =====================================================================
#  ESX Legacy (framework + ressources officielles)
# =====================================================================
ensure es_extended
ensure [core]

# =====================================================================
#  Noxa — panels & interfaces NUI (designs Claude Design, visuels exacts)
# =====================================================================
ensure noxa_anticheat   # Panel anti-cheat tablette N&B (F6, admin/ACE)
ensure noxa_gestion     # Panel gestion serveur (F9, superadmin)
ensure noxa_phone       # Téléphone (F1)
ensure noxa_inventaire  # Inventaire (I)

add_ace group.admin noxa.anticheat allow
add_ace group.admin noxa.gestion allow
